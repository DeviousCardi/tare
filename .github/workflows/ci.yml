name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: suite (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Suite
        run: pytest -q
        env:
          TZ: UTC

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t tare:ci .

      - name: It comes up and answers
        run: |
          docker run -d --name tare-ci -p 8000:8000 tare:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"service":"tare"'
          docker rm -f tare-ci
