name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: suite (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check tare tests

      - name: Suite
        run: pytest -q
        env:
          TZ: UTC

  sweeps:
    name: sweeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: No test name is used twice
        run: |
          pytest -q --collect-only 2>/dev/null | grep '::' \
            | sed 's|/|.|g; s|\.py::|.|' | sort > /tmp/ids
          test "$(wc -l < /tmp/ids)" = "$(sort -u /tmp/ids | wc -l)" \
            || { echo "duplicate test ids:"; sort /tmp/ids | uniq -d; exit 1; }

      - name: Nothing in the service reads the clock
        run: |
          ! grep -rnE "datetime\.now|date\.today|time\.time|utcnow" tare/ \
            --exclude-dir=__pycache__

      - name: Nothing names a defect and its remedy
        run: |
          ! grep -rnE 'TODO|FIXME|HACK' tare/ --exclude-dir=__pycache__

  image:
    name: image
    needs: [test, sweeps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t tare:ci .

      - name: It comes up and answers
        run: |
          docker run -d --name tare-ci -p 8000:8000 tare:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"service":"tare"'
          docker rm -f tare-ci
